version: '3.8'

services:
  api:
    build:
      context: ./src
      dockerfile: HotelChatbot.Api/Dockerfile
    container_name: hotelchatbot-api
    ports:
      - "5001:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Crawl__EnablePlaywright=false
      - ConnectionStrings__PostgreSQL=${POSTGRES_CONNECTION}
      - OpenAI__Endpoint=${OPENAI_ENDPOINT}
      - OpenAI__ApiKey=${OPENAI_API_KEY}
      - OpenAI__DeploymentName=${OPENAI_DEPLOYMENT:-gpt-4.1-mini}
      - OpenAI__EmbeddingDeploymentName=${OPENAI_EMBEDDING_DEPLOYMENT:-text-embedding-3-small}
      - OpenAI__EmbeddingDimensions=1536
      - SpeechService__SubscriptionKey=${SPEECH_KEY}
      - SpeechService__ServiceRegion=${SPEECH_REGION:-germanywestcentral}
      - ElevenLabs__ApiKey=${ELEVENLABS_API_KEY}
      - ElevenLabs__VoiceId=${ELEVENLABS_VOICE_ID}
      - ElevenLabs__BaseUrl=https://api.elevenlabs.io/v1/text-to-speech/
      - AdminAuth__AdminPassword=${ADMIN_PASSWORD}
      - AdminAuth__HotelPassword=${HOTEL_PASSWORD}
      - AdminAuth__TokenSecret=${ADMIN_TOKEN_SECRET}
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/chat/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - chatbot-network

  crawl-worker:
    build:
      context: ./src
      dockerfile: HotelChatbot.Api/Dockerfile.crawl
    container_name: hotelchatbot-crawl
    ports:
      - "5002:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Crawl__EnablePlaywright=true
      - ConnectionStrings__PostgreSQL=${POSTGRES_CONNECTION}
      - OpenAI__Endpoint=${OPENAI_ENDPOINT}
      - OpenAI__ApiKey=${OPENAI_API_KEY}
      - OpenAI__DeploymentName=${OPENAI_DEPLOYMENT:-gpt-4.1-mini}
      - OpenAI__EmbeddingDeploymentName=${OPENAI_EMBEDDING_DEPLOYMENT:-text-embedding-3-small}
      - OpenAI__EmbeddingDimensions=1536
    mem_limit: 2g
    cpus: 1.5
    profiles:
      - crawl
    restart: unless-stopped
    networks:
      - chatbot-network

  mcp:
    build:
      context: ./chatgpt
      dockerfile: Dockerfile
    container_name: hotelchatbot-mcp
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - API_BASE_URL=http://api:8080
      - NODE_ENV=production
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - chatbot-network

networks:
  chatbot-network:
    driver: bridge
